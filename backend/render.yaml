# Arquivo de configuração Render.com para o backend do Portal FBKE (quando apontado diretamente para a pasta backend)
services:
  - type: web
    name: fbke
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: 1
      - key: FRONTEND_ORIGINS
        value: https://fbke-frmb.vercel.app

